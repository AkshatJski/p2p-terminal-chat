# =============================================================================
# P2P Terminal Chat - configuration file
# =============================================================================
# This file is optional. The app looks for it in this order:
#   1. the file you pass with  --config <path>      (e.g. java -jar app.jar --config config.properties)
#   2. ./config.properties                          (next to the jar / in the working dir)
#   3. ~/.p2p-chat/config.properties                (per-user default location)
# If none exists, the built-in defaults shown below are used.
#
# Every key below can also be overridden on the command line (see
# CONFIGURATION.md). Command line wins over this file.
# =============================================================================

# TCP port the chat Host listens on and Join connects to.           (default 8080)
port=8080

# TCP port the mesh Listen mode binds to.                           (default 8081)
mesh.port=8081

# Where the persistent X25519 identity key is stored.
# Use ${user.home} for a home-relative path.                        (default ${user.home}/.p2p-chat/identity.key)
identity.file=${user.home}/.p2p-chat/identity.key

# Where the trusted-fingerprint store lives.                        (default ${user.home}/.p2p-chat/trusted.txt)
trust.file=${user.home}/.p2p-chat/trusted.txt

# Maximum accepted encrypted frame size in bytes (1 MiB default).
# Raise this if you ever send very large messages.                  (default 1048576)
frame.max.size=1048576

# Handshake timeout in milliseconds (how long to wait for the other
# side's crypto handshake before giving up).                        (default 10000)
handshake.timeout.ms=10000

# Mesh flooding time-to-live (maximum number of hops a message can
# travel before it is dropped).                                     (default 8)
mesh.ttl=8

# Folder where files received in a room are saved, relative to the
# working directory.                                                 (default downloads)
download.dir=downloads
